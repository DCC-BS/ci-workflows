name: Python Backend CI (Reusable)

# v2: mise-based. Delegates to the unified ci.yml. The make-based v1 is frozen
# under the @v1 tag. tool versions (python, uv) come from the project's mise.toml.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project directory (must contain mise.toml)"
        required: false
        type: string
        default: "."
      check-command:
        description: "Command for the quality check (lock, format, lint, types, secret scan)"
        required: false
        type: string
        default: "mise run check"
      test-command:
        description: "Command for the unit test step"
        required: false
        type: string
        default: "mise run test"
      run-test:
        description: "Run the test step"
        required: false
        type: boolean
        default: true

jobs:
  backend-ci:
    uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@v2
    with:
      working-directory: ${{ inputs.working-directory }}
      run-install: true
      run-check: true
      check-command: ${{ inputs.check-command }}
      run-test: ${{ inputs.run-test }}
      test-command: ${{ inputs.test-command }}
      run-build: false
      run-e2e: false
