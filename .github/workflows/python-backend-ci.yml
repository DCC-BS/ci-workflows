name: Python Backend CI (Reusable)

# v2: mise-based. Delegates to the unified ci.yml. Steps auto-detect their
# corresponding mise tasks (check, test:unit); no run-* flags are forwarded.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project directory (must contain mise.toml)"
        required: false
        type: string
        default: "."
      check-command:
        description: "Command for the quality check (lock, format, lint, types, secret scan)"
        required: false
        type: string
        default: "mise run check"
      test-command:
        description: "Command for the unit test step"
        required: false
        type: string
        default: "mise run test:unit"

jobs:
  backend-ci:
    uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@v2
    with:
      working-directory: ${{ inputs.working-directory }}
      check-command: ${{ inputs.check-command }}
      test-command: ${{ inputs.test-command }}