name: Frontend CI (Reusable)

# v2: mise-based. Delegates to the unified ci.yml. The bun-based v1 is frozen
# under the @v1 tag. tool versions (bun, node) come from the project's mise.toml.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project directory (must contain mise.toml)"
        required: false
        type: string
        default: "."
      build-command:
        description: "Command for the build step"
        required: false
        type: string
        default: "mise run build"
      test-command:
        description: "Command for the unit test step (e.g. vitest)"
        required: false
        type: string
        default: "mise run test"
      e2e-command:
        description: "Command for the e2e step (e.g. playwright)"
        required: false
        type: string
        default: "mise run test:e2e"
      run-build:
        description: "Run the build step"
        required: false
        type: boolean
        default: true
      run-e2e:
        description: "Run e2e tests"
        required: false
        type: boolean
        default: true
      upload-playwright-report:
        description: "Upload the Playwright report artifact"
        required: false
        type: boolean
        default: true
      artifact-retention-days:
        description: "Retention for the Playwright report artifact"
        required: false
        type: number
        default: 30

jobs:
  frontend-ci:
    uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@v2
    with:
      working-directory: ${{ inputs.working-directory }}
      run-install: true
      run-check: true
      run-test: true
      test-command: ${{ inputs.test-command }}
      run-build: ${{ inputs.run-build }}
      build-command: ${{ inputs.build-command }}
      run-e2e: ${{ inputs.run-e2e }}
      e2e-command: ${{ inputs.e2e-command }}
      upload-playwright-report: ${{ inputs.upload-playwright-report }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
