name: Frontend CI (Reusable)

# v2: mise-based. Delegates to the unified ci.yml. Steps auto-detect their
# corresponding mise tasks (check, test:unit, build, test:e2e); no run-* flags
# are forwarded. Browser install is expected to live inside the project's
# `mise run test:e2e` task.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project directory (must contain mise.toml)"
        required: false
        type: string
        default: "."
      build-command:
        description: "Command for the build step"
        required: false
        type: string
        default: "mise run build"
      test-command:
        description: "Command for the unit test step (e.g. vitest)"
        required: false
        type: string
        default: "mise run test:unit"
      e2e-command:
        description: "Command for the e2e step (e.g. playwright)"
        required: false
        type: string
        default: "mise run test:e2e"
      upload-playwright-report:
        description: "Upload the Playwright report artifact"
        required: false
        type: boolean
        default: true
      artifact-retention-days:
        description: "Retention for the Playwright report artifact"
        required: false
        type: number
        default: 30

jobs:
  frontend-ci:
    uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@v9
    with:
      working-directory: ${{ inputs.working-directory }}
      check-command: "mise run check"
      test-command: ${{ inputs.test-command }}
      build-command: ${{ inputs.build-command }}
      e2e-command: ${{ inputs.e2e-command }}
      upload-playwright-report: ${{ inputs.upload-playwright-report }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}