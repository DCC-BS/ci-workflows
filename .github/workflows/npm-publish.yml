name: Publish Package to NPM

on:
    workflow_call:
        inputs:
            node_version:
                description: "Override the Node.js version (default: the one in the repo's mise.toml)"
                required: false
                type: string
                default: ""
            registry_url:
                description: "Registry URL passed to setup-node"
                required: false
                type: string
                default: "https://registry.npmjs.org"
            bun_version:
                description: "Override the Bun version (default: the one in the repo's mise.toml)"
                required: false
                type: string
                default: ""
            install_command:
                description: "Command to install dependencies"
                required: false
                type: string
                default: "bun install"
            build_command:
                description: "Optional build command (skip when empty)"
                required: false
                type: string
                default: "bun generate"
            prepack_command:
                description: "Optional prepack command (skip when empty)"
                required: false
                type: string
                default: "bun run prepack"
            publish_command:
                description: "Command that publishes the package"
                required: false
                type: string
                default: "npm publish --access public"

jobs:
    publish:
        name: Publish Package
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # Same toolchain as CI and local dev: bun/node come from the repo's mise.toml, so the
            # published build never uses a different ("latest") version than the one that was tested.
            - name: Setup mise
              uses: DCC-BS/ci-workflows/actions/setup-mise@2a3ee19f23bdd73724875e6771acd6636b9ac36b # v10

            - name: Apply version overrides
              if: ${{ inputs.node_version != '' || inputs.bun_version != '' }}
              env:
                  NODE_VERSION: ${{ inputs.node_version }}
                  BUN_VERSION: ${{ inputs.bun_version }}
              run: |
                  if [ -n "$NODE_VERSION" ]; then mise use "node@$NODE_VERSION"; fi
                  if [ -n "$BUN_VERSION" ]; then mise use "bun@$BUN_VERSION"; fi

            - name: Configure registry
              env:
                  REGISTRY_URL: ${{ inputs.registry_url }}
              run: npm config set registry "$REGISTRY_URL"

            - name: Install dependencies
              if: ${{ inputs.install_command != '' }}
              run: ${{ inputs.install_command }}

            - name: Build project
              if: ${{ inputs.build_command != '' }}
              run: ${{ inputs.build_command }}

            - name: Run prepack
              if: ${{ inputs.prepack_command != '' }}
              run: ${{ inputs.prepack_command }}

            - name: Publish Package
              run: ${{ inputs.publish_command }}
