name: CI (install & test)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project directory (must contain mise.toml)"
        required: false
        type: string
        default: "."
      check-command:
        description: "Command for the check step (the `ci-check` task guard only applies to the default)"
        required: false
        type: string
        default: "mise run ci-check"
      test-command:
        description: "Command for the test step (the `test:unit` task guard only applies to the default)"
        required: false
        type: string
        default: "mise run test:unit"
      build-command:
        description: "Command for the build step (the `build` task guard only applies to the default)"
        required: false
        type: string
        default: "mise run build"
      e2e-command:
        description: "Command for the e2e step (the `test:e2e` task guard only applies to the default)"
        required: false
        type: string
        default: "mise run test:e2e"
      upload-playwright-report:
        description: "Upload the Playwright report artifact (requires a `test:e2e` task)"
        required: false
        type: boolean
        default: false
      artifact-retention-days:
        description: "Retention for the Playwright report artifact"
        required: false
        type: number
        default: 30

jobs:
  ci:
    name: CI (install & test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Allow the Playwright report summary action to comment on pull requests.
      # Comments still fail gracefully (with a job summary fallback) for fork PRs,
      # where GitHub never grants write permissions to the workflow token.
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      # ci mode makes secret-dependent steps (e.g. varlock scan) work without
      # a pass-cli login, so `mise run check` is safe to run in CI.
      APP_MODE: ci
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup mise
        uses: DCC-BS/ci-workflows/actions/setup-mise@b0f3abf4e131b4834279fb3ba3b4ecf366c52fdc # v10
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Detect mise tasks
        id: detect-tasks
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          tasks_json="$(mise tasks ls --json)"
          has() {
            echo "$tasks_json" | jq -r --arg t "$1" \
              'map(.name) | index($t) != null'
          }
          echo "has-check=$(has ci-check)"        >> "$GITHUB_OUTPUT"
          echo "has-test-unit=$(has test:unit)"   >> "$GITHUB_OUTPUT"
          echo "has-test-e2e=$(has test:e2e)"     >> "$GITHUB_OUTPUT"
          echo "has-build=$(has build)"           >> "$GITHUB_OUTPUT"

      - name: Build
        if: ${{ inputs.build-command != 'mise run build' || steps.detect-tasks.outputs.has-build == 'true' }}
        run: ${{ inputs.build-command }}

      - name: Check
        if: ${{ inputs.check-command != 'mise run ci-check' || steps.detect-tasks.outputs.has-check == 'true' }}
        run: ${{ inputs.check-command }}

      - name: Test
        if: ${{ inputs.test-command != 'mise run test:unit' || steps.detect-tasks.outputs.has-test-unit == 'true' }}
        run: ${{ inputs.test-command }}

      - name: E2E tests
        if: ${{ inputs.e2e-command != 'mise run test:e2e' || steps.detect-tasks.outputs.has-test-e2e == 'true' }}
        run: ${{ inputs.e2e-command }}

      - name: Summarize Playwright report
        if: ${{ always() && (inputs.e2e-command != 'mise run test:e2e' || steps.detect-tasks.outputs.has-test-e2e == 'true') }}
        uses: daun/playwright-report-summary@31ed947ec7a623d18a66cfd20ef546dc66ef8063 # v4.1.0
        with:
          report-file: results.json
          # Also write the results to the workflow run summary, so they are
          # available even when a PR comment cannot be created (e.g. fork PRs).
          job-summary: true

      - name: Upload Playwright report
        if: ${{ !cancelled() && (inputs.e2e-command != 'mise run test:e2e' || steps.detect-tasks.outputs.has-test-e2e == 'true') && inputs.upload-playwright-report }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: ${{ inputs.working-directory }}/playwright-report/
          retention-days: ${{ inputs.artifact-retention-days }}
