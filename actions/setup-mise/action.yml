name: "Setup mise"
description: "Install mise and provision all tools defined in the project's mise.toml (cached)."
inputs:
  working-directory:
    description: "Directory containing mise.toml"
    required: false
    default: "."
  experimental:
    description: "Enable mise experimental features"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Install mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: false
        cache: true
        experimental: ${{ inputs.experimental }}

    - name: Trust config and install tools
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        mise trust
        mise install
