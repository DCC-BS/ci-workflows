name: "Setup mise"
description: "Install mise and provision all tools defined in the project's mise.toml (cached)."
inputs:
  working-directory:
    description: "Directory containing mise.toml"
    required: false
    default: "."
  experimental:
    description: "Enable mise experimental features"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Install mise
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        install: false
        cache: true
        experimental: ${{ inputs.experimental }}

    - name: Trust config and install tools
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        mise trust
        mise install
